[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-guards"
version = "0.1.0"
description = "Shared credential detection and safe filesystem primitives"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fleet-guards = "fleet_guards.__main__:main"

[tool.setuptools]
packages = ["fleet_guards"]
