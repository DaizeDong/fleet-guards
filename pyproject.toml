[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-guards"
version = "0.2.1"
description = "Shared credential detection and safe filesystem primitives"
readme = "PACKAGE.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fleet-guards = "fleet_guards.__main__:main"

[tool.setuptools]
packages = ["fleet_guards", "fleet_guards._canonical"]

[tool.setuptools.package-dir]
"fleet_guards._canonical" = "tools"
