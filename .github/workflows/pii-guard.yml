# The kit's own gate, run through the kit's own action.
#
# It used to be a second copy of those steps. Two copies of the same argument, one of them the
# thing shipped to every consumer and one of them what this repo actually proves about itself, is
# how the shipped path breaks while the source repo stays green. Now the action IS the subject:
# if `uses: ./ci/pii-guard` fails here, it would have failed in 23 consumers.
name: pii-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the history scan is the point; a shallow clone would see nothing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./ci/pii-guard
