name: Dispatch fleet consumers

on:
  workflow_call:
    inputs:
      workflow:
        description: >-
          Gate workflow file name of a custom upstream, for example ci.yml. Leave
          empty for the built-in kits, which always use their own gate on main.
        type: string
        required: false
        default: ''
      branch:
        description: >-
          Branch a custom upstream publishes from, for example master. Required
          together with workflow; leave both empty for the built-in kits.
        type: string
        required: false
        default: ''
    secrets:
      targets:
        required: true
      credentials:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DaizeDong/fleet-guards
          ref: a5a932b99640db43c814388b86bd9e932aa1f59b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Notify subscribers after verifying the upstream commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FLEET_SYNC_TARGETS: ${{ secrets.targets }}
          FLEET_SYNC_CREDENTIALS: ${{ secrets.credentials }}
          FLEET_SYNC_UPSTREAM_WORKFLOW: ${{ inputs.workflow }}
          FLEET_SYNC_UPSTREAM_BRANCH: ${{ inputs.branch }}
        run: python tools/fleet_sync.py dispatch
