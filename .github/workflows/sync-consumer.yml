name: Synchronize fleet submodules

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner for the sync job, as JSON: a label string or an array of labels,
          for example '["self-hosted","linux"]'. The default keeps GitHub-hosted Ubuntu.
        type: string
        required: false
        default: '"ubuntu-latest"'
      sources:
        description: >-
          Optional extra upstreams this consumer follows, as a JSON object mapping
          "owner/repo" to {"workflow": "<gate workflow file>", "branch": "<branch>"}.
          The built-in kits are always followed on main and cannot be redeclared.
          The sync token must be able to read every declared upstream.
        type: string
        required: false
        default: ''
    secrets:
      sync-token:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - name: Require the enrolled consumer credential
        env:
          SYNC_TOKEN: ${{ secrets.sync-token }}
        run: test -n "$SYNC_TOKEN"
      - uses: actions/checkout@v4
        with:
          path: consumer
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.sync-token }}
      - uses: actions/checkout@v4
        with:
          repository: DaizeDong/fleet-guards
          ref: a5a932b99640db43c814388b86bd9e932aa1f59b
          path: fleet-sync-tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Advance verified gitlinks and run commit gates
        working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.sync-token }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || '' }}
          FLEET_SYNC_EVENT: ${{ github.event_name }}
          FLEET_SYNC_SOURCES: ${{ inputs.sources }}
          CONSUMER_BRANCH: ${{ github.event.repository.default_branch }}
        run: python ../fleet-sync-tool/tools/fleet_sync.py update --refresh-visibility
