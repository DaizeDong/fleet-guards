# The kit's own dash gate, run through the kit's own action. See pii-guard.yml for why this is a
# caller rather than a second copy of the steps.
name: dash-guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./ci/dash-guard
