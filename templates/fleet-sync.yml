name: Sync fleet submodules

on:
  repository_dispatch:
    types: [fleet-submodule-update]
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: fleet-submodule-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: DaizeDong/fleet-guards/.github/workflows/sync-consumer.yml@main
    # Optional: follow extra upstreams besides the built-in kits, including private ones.
    # Each key is "owner/repo"; "workflow" is the upstream's gate workflow file and "branch" the
    # branch it publishes from. The matching .gitmodules entry must name the same branch (a
    # missing branch means main), and FLEET_SYNC_TOKEN must be able to read the upstream.
    # Declare a private upstream only in a private consumer: a public one exposes its name in
    # .gitmodules, in this file and in the Actions logs.
    # with:
    #   sources: '{"example/upstream": {"workflow": "ci.yml", "branch": "master"}}'
    secrets:
      sync-token: ${{ secrets.FLEET_SYNC_TOKEN }}
