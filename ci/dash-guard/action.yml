name: dash-guard
description: House rule that published prose carries no en/em dash, checked against the CALLING repo.

# Style, not security, so it scans the current tree only: a dash in old history is harmless and
# needs no rewrite. See ci/pii-guard/action.yml for why these steps live here rather than in a
# workflow every consumer copies.

runs:
  using: composite
  steps:
    # Run the guard's OWN tests first, exactly as pii-guard does. The reason is not symmetry: until
    # 2026-07-30 a git failure (not a repo, no git on PATH, an index lock, an extracted archive)
    # made the scanner enumerate zero files and print "dash_guard: clean" with exit 0. This job's
    # entire content is one command, so a run that examined nothing reported success.
    - name: Guard's own tests (a scan that never ran must not report clean)
      shell: bash
      run: |
        python -m pip install --quiet pytest
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_dash_guard.py" -q

    - name: No en/em dash in published prose
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/dash_guard.py" --tree
