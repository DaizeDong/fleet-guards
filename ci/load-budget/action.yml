name: load-budget
description: PHILOSOPHY P7 always-loaded budget and the no-second-copy rule, against the CALLING repo.

# WHY THIS RUNS AT ALL. load_budget.py was vendored into 18 repos and wired into nothing: no push,
# no hook, no schedule. A control that executes nowhere is not a weak control, it is the absence of
# one wearing the costume of a control -- a reader greps the repo, sees a P7 gate sitting next to
# the guards that do run, and reasonably concludes P7 is enforced. Either it runs or it stops being
# carried. This is it running.

runs:
  using: composite
  steps:
    # The guard's OWN tests, first, exactly as dash-guard and pii-guard do it.
    #
    # This step did not exist until 2026-08-27 because the tests did not exist, and that gap was the
    # interesting one: of the three guards, this was the only one shipping as a CI gate with nothing
    # proving it could still fail. It was also the one that needed it most, because HALF OF IT COULD
    # NOT FAIL. `dup_pct` over the threshold blocked; `always_loaded_lines` over ALWAYS_LOADED_WARN
    # printed a note and the row still read "ok". So the gate named for the always-loaded budget
    # enforced no always-loaded budget, and no test anywhere would have noticed.
    #
    # test_load_budget.py pairs every guarantee with a NEGATIVE CONTROL: an over-budget SKILL.md
    # that must exit 1, a duplicated paragraph that must exit 1, a threshold flipped across the same
    # fixture that must flip the verdict, an empty SKILL.md that must not read as clean, and a repo
    # with no SKILL.md at all that must exit 3. Verified by breaking the tool four different ways
    # and watching the matching tests go red each time.
    #
    # It lives HERE rather than in one consumer's workflow, which is where it was until the
    # submodule migration. It had been written into a single repo's copy of the file, so the other
    # repos ran the gate with nothing proving it worked, and a thin rewrite of that one file dropped
    # it without noticing. One copy, every consumer, is the point of this directory.
    - name: Guard's own tests (a budget that cannot be exceeded is not a budget)
      shell: bash
      run: |
        python -m pip install --quiet pytest
        test -f "$GITHUB_ACTION_PATH/../../tools/test_load_budget.py" || {
          echo "::error::the guards submodule has no test_load_budget.py, so this job would run an unproven gate, which is how the always-loaded half sat inert"; exit 1; }
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_load_budget.py" -q

    - name: Always-loaded budget (P7)
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/load_budget.py" .
