name: pii-guard
description: Run the publication policy against the CALLING repository.

# Referenced by local path through the guards submodule (`uses: ./guards/ci/pii-guard`), so it moves
# only when the consumer advances its submodule pointer. The consumer's workflow is checkout
# (fetch-depth 0, submodules), python, and this line.

runs:
  using: composite
  steps:
    - name: Publication policy (private proof, or full public boundary and history scans)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python "$GITHUB_ACTION_PATH/../../tools/publication_guard.py" ci
