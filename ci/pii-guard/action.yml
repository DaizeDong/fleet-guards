name: pii-guard
description: Run the pii-guard suite and scanners against the CALLING repository.

# WHY THIS IS A COMPOSITE ACTION AND NOT A WORKFLOW EACH REPO COPIES
#
# The steps below carry the reasoning for every one of them, and that reasoning is the valuable
# part: it is the only record of which silent-pass state each step was added to close. Copied into
# every consumer, it becomes 21 divergent copies of an argument, and the copies drift -- which is
# not hypothetical, it had already happened to the vendored scanner within days.
#
# As an action referenced by LOCAL PATH through the guards submodule (`uses: ./guards/ci/pii-guard`),
# there is one copy, and it moves only when the consumer advances its submodule pointer. Pinned, not
# floating: a bad commit here cannot reach 21 repos on its own.
#
# The consumer's workflow is reduced to checkout, python, and this line.

runs:
  using: composite
  steps:
    - name: Guard's own tests (does it still catch the leaks it was built for?)
      shell: bash
      run: |
        python -m pip install --quiet pytest
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_pii_guard.py" -q

    # The v2 policy-layer suite. Not optional and not wrapped in a file test, for the same reason
    # as the steps below: a repo whose copy went missing would otherwise go green on a step that
    # never ran.
    #
    # These tests are about a layer that DOES NOT EXIST ON THIS RUNNER. There is no private
    # denylist in CI and there never will be, so what is verified here is the SHAPE of the policy
    # machinery: that an unknown format raises instead of guessing, that a missing canary or a
    # wrong count is refused rather than half-loaded, that a derivable companion name is admitted
    # as reportable rather than blocking, and that a history-only exemption does not reach live
    # content. Every one of those is a property of the code, checkable with synthetic fixtures,
    # and every one of them is a property whose violation used to be silent.
    - name: Policy-layer tests (can the private layer still prove it loaded?)
      shell: bash
      run: |
        test -f "$GITHUB_ACTION_PATH/../../tools/test_pii_guard_v2.py" || {
          echo "::error::the guards submodule has no test_pii_guard_v2.py -- run 'git submodule update --init', do not skip"; exit 1; }
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_pii_guard_v2.py" -q

    # The resolver's tests. datadir.py decides WHERE real-run output goes, which makes it the one
    # file no downstream scanner can compensate for. A resolver that silently answers None looks
    # exactly like a skill that has no data, and that ambiguity is how the out-of-band boundary
    # check reported a clean sheet over skills writing a live ledger every day.
    #
    # NOT wrapped in `if [ -f ... ]`. Both steps used to be, and that made THE AUTHORITY fail open:
    # a repo whose copy was missing (a stale default branch, a bad merge, a deletion) went green on
    # a step that never ran. ABSENT is a failure, not a reason to skip. Verified 2026-07-31 by
    # deleting each file and watching the step exit non-zero.
    - name: Resolver tests (does the data pipe still point outside this repo?)
      shell: bash
      run: |
        test -f "$GITHUB_ACTION_PATH/../../tools/test_datadir.py" || {
          echo "::error::the guards submodule has no test_datadir.py -- a guard that is not here is not a guard"; exit 1; }
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_datadir.py" -q

    # The DATA BOUNDARY -- the primary control. It is the question that actually matters: is this
    # repo an uninitialized tool, or does it contain somebody's life?
    #
    # pii_guard (below) is the backstop. It reads content and looks for things that SMELL private,
    # which is why it was clean while a public repo held real-run output from the operator's own
    # account and a full record of their private activity. A ticker with an entry price has no
    # email in it, no phone, no ZIP -- nothing to smell. The scanner cannot see a leak that looks
    # like data, so the boundary has to make the leak structurally impossible instead.
    #
    # .dataclass.json stays in the CONSUMER, not here: which paths are TOOL, FIXTURE or DATA is a
    # fact about that repo and cannot be shared. A missing one is fatal, because data_boundary
    # would otherwise exit 0 on every run and leave the primary control inert.
    - name: Data boundary (is this an uninitialized tool?)
      shell: bash
      run: |
        test -f "$GITHUB_ACTION_PATH/../../tools/data_boundary.py" || {
          echo "::error::the guards submodule has no data_boundary.py -- the PRIMARY control cannot be optional"; exit 1; }
        test -f .dataclass.json || {
          echo "::error::.dataclass.json is MISSING from this repo -- data_boundary would exit 0 on every run"; exit 1; }
        python "$GITHUB_ACTION_PATH/../../tools/data_boundary.py"

    # The companion contract, checked against the resolver by construction.
    #
    # It ran NOWHERE until 2026-09-04. It is a script, not a pytest module, so `pytest tools/`
    # collected nothing from it and every job that looked like it covered the kit skipped it in
    # silence. It was failing at the time it was found, because a change to the resolver had made
    # the document stale -- which is precisely the drift it exists to catch, sitting undetected
    # because nothing invoked the detector.
    #
    # Run by path, and its exit code is the step's. Not piped into anything: a pipe would hand this
    # step the exit status of the last command in it, which is the defect that let a guard print
    # findings while the commit sailed through.
    - name: Companion contract (does the document still describe the resolver?)
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/test_companion_contract.py"

    - name: Scan working tree + full history
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/pii_guard.py" --tree --history
